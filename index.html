<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z_Test</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
  </head>
  <body>

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-left">
        <div class="logo">Z</div>
      </div>

      <div class="top-center"></div>

      <div class="top-right">
        <button class="hamburger-btn" id="hamburger-btn">&#9776;</button>
      </div>
    </header>

    <!-- Slide-in Menu -->
    <nav class="side-menu" id="side-menu">
      <ul class="side-menu-list">
        <li><span class="side-menu-item" data-modal="What is Z_Test?">What is Z_Test?</span></li>
        <li><span class="side-menu-item" data-modal="How to use Z_Test">How to use Z_Test</span></li>
        <li><span class="side-menu-item" data-modal="Problems / Feedback">Problems / Feedback</span></li>
        <li><span class="side-menu-item" data-modal="Contact">Contact</span></li>
      </ul>
    </nav>

    <!-- Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-body" id="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="panel">
        <div class="panel-header">Lessons</div>
        <div class="panel-nav-content"></div>
      </div>
      <div class="panel panel-tests">
        <div class="panel-header">Question</div>
        <div class="tests-content"></div>
        <div class="tests-footer">
          <button class="reset-btn" id="reset-btn">Reset</button>
        </div>
      </div>
      <div class="panel panel-right">
        <div class="panel-sub panel-code">
          <div class="panel-header">Code</div>
          <textarea id="code-editor"></textarea>
          <div class="run-controls">
            <span class="run-hint">CTRL+ENTER run/next</span>
            <button class="run-btn" id="run-btn">Run</button>
          </div>
        </div>
        <div class="divider-handle">
          <div class="divider-knob">
            <span>&#9650;</span>
            <span>&#9660;</span>
          </div>
        </div>
        <div class="panel-sub panel-terminal">
          <div class="panel-header">Terminal</div>
          <div class="terminal-output"></div>
          <div class="terminal-footer">
            <button class="clear-btn" id="clear-btn">Clear</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottom-bar">
      <div class="bottom-left"></div>
      <div class="bottom-center">
        <span class="progress">0 / 0</span>
      </div>
      <div class="bottom-right">
        <button class="nav-btn" id="back-btn">Back</button>
        <button class="nav-btn" id="next-btn">Next</button>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/javascript-lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>
    <script src="allTests.js"></script>
    <script src="index.js"></script>
  </body>
</html>
